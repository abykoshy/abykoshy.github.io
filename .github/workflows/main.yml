name: Set Issue Aquad for Support
on:
  issues:
    types:
      - opened
jobs:
  label_issues:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
      - name: Set field
        run: |
          echo $(gh project list --owner $OWNER --format json)
          ISSUE_ITEM_ID=$(gh project item-list --owner abykoshy 1 --format json | jq -r '.items[] | select(.content.number == 2) | .id')

          gh project item-edit --project-id $vars.PROJECT_ID --field-id $vars.FIELD_ID --single-select-option-id $vars.FIELD_OPTION_VALUE_ID --id $ISSUE_ITEM_ID
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELS: triage
          OWNER: abykoshy
          PROJECT_NUMBER: 1
          FIELD_NAME: Team
          FIELD_VALUE: fromaction
